name: Build Desktop Downloads

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS DMG
            os: macos-latest
            script: npm run desktop:dist:mac:built
            files: dist/*.dmg
          - name: Windows EXE
            os: windows-latest
            script: npm run desktop:dist:win:built
            files: dist/*.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build desktop installer
        run: ${{ matrix.script }}

      - name: Attach installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
